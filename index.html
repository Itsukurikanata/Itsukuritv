<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字幕つきHLSプレイヤー</title>
<style>
body{margin:0;padding:12px;background:#111;color:#eee;font-family:-apple-system,sans-serif}
.wrap{position:relative;background:#000}
video{width:100%;display:block}
input{width:100%;box-sizing:border-box;padding:8px;margin:8px 0}
button{padding:8px 12px;margin:0 6px 6px 0}
#log{font-size:12px;color:#999;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap"><video id="v" controls playsinline></video></div>
<input id="u" value="https://tv-stream-test.daydreamer-json.cc/fe8bf835820fb530467f75a9cb761504/hevc/playlist.m3u8">
<button id="go1">再生(CORSあり)</button>
<button id="go2">再生(CORSなし)</button>
<button id="cap">字幕 ON/OFF</button>
<div id="log"></div>
<script src="https://cdn.jsdelivr.net/npm/aribb24.js@1.10.4/dist/aribb24.js"></script>
<script>
var v=document.getElementById('v'),log=document.getElementById('log'),r=null,on=true,cues=0,hooked={};
function say(t){log.textContent+=t+'\n'}
function hook(){
  for(var i=0;i<v.textTracks.length;i++){
    var t=v.textTracks[i];
    if(t.kind!=='metadata'||hooked[i])continue;
    hooked[i]=1;t.mode='hidden';
    t.addEventListener('cuechange',function(e){
      var tr=e.target,list=tr.activeCues||[];
      for(var k=0;k<list.length;k++){
        var c=list[k];cues++;
        if(cues<=3)say('cue: '+(c.type||'')+' '+JSON.stringify(Object.keys(c.value||{})));
        var d=c.value&&c.value.data;
        if(!d||!r)continue;
        try{
          var u=new Uint8Array(d);
          if(r.pushData)r.pushData(0,u,c.startTime);
        }catch(err){say('push error: '+err)}
      }
    });
  }
}
function start(cors){
  log.textContent='';
  var L=window.aribb24js;
  if(!r&&L){r=new L.CanvasRenderer({forceStrokeColor:'black'});r.attachMedia(v);r.show();say('字幕レンダラー: OK');}
  v.pause();v.removeAttribute('src');
  if(cors)v.setAttribute('crossorigin','anonymous');else v.removeAttribute('crossorigin');
  v.src=document.getElementById('u').value.trim();
  v.addEventListener('error',function(){say('映像エラー code='+(v.error&&v.error.code))},{once:true});
  v.play().catch(function(e){say('再生開始: '+e)});
  setInterval(hook,1000);
  setTimeout(function(){say('metadata cue数: '+cues)},8000);
}
document.getElementById('go1').onclick=function(){start(true)};
document.getElementById('go2').onclick=function(){start(false)};
document.getElementById('cap').onclick=function(){if(!r)return;on=!on;on?r.show():r.hide()};
</script>
</body>
</html>
