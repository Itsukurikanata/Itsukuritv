<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字幕つきプレイヤー</title>
<style>
body{margin:0;padding:12px;background:#111;color:#eee;font-family:-apple-system,sans-serif}
.wrap{position:relative;background:#000}
video{width:100%;display:block}
input{width:100%;box-sizing:border-box;padding:8px;margin:6px 0}
button{padding:8px 12px;margin:0 6px 6px 0}
#log{font-size:12px;color:#999;white-space:pre-wrap}
</style></head><body>
<div class="wrap"><video id="v" controls playsinline></video></div>
<input id="hls" value="https://tv-stream-test.daydreamer-json.cc/fe8bf835820fb530467f75a9cb761504/hevc/playlist.m3u8">
<input id="ts" value="https://tsb-mega.i9.ee/stream/nhkg_avc_1080p">
<button id="go">再生</button>
<button id="cap">字幕 ON/OFF</button>
<button id="m">字幕を遅らせる</button>
<button id="p">字幕を早める</button>
<span id="d">遅れ: 0.0秒</span>
<div id="log"></div>
<script src="https://cdn.jsdelivr.net/npm/aribb24.js@1.10.4/dist/aribb24.js"></script>
<script>
var v=document.getElementById('v'),logEl=document.getElementById('log'),r=null,on=true,delay=0,n=0;
function say(t){logEl.textContent+=t+'\n'}
function showD(){document.getElementById('d').textContent='遅れ: '+delay.toFixed(1)+'秒'}
document.getElementById('m').onclick=function(){delay+=0.5;showD()};
document.getElementById('p').onclick=function(){delay-=0.5;showD()};
document.getElementById('cap').onclick=function(){if(!r)return;on=!on;on?r.show():r.hide()};

function ss(b,o){return (b[o]<<21)|(b[o+1]<<14)|(b[o+2]<<7)|b[o+3]}
function privs(b){
  var out=[],i=0;
  while(i+10<=b.length&&b[i]==0x49&&b[i+1]==0x44&&b[i+2]==0x33){
    var ver=b[i+3],size=ss(b,i+6),j=i+10,end=i+10+size;
    while(j+10<=end&&b[j]!=0){
      var fid=String.fromCharCode(b[j],b[j+1],b[j+2],b[j+3]);
      var fs=ver==4?ss(b,j+4):((b[j+4]*16777216)+(b[j+5]<<16)+(b[j+6]<<8)+b[j+7]);
      if(fid=='PRIV'){
        var d=b.subarray(j+10,j+10+fs),k=d.indexOf(0);
        if(k>0&&String.fromCharCode.apply(null,d.subarray(0,k))=='aribb24.js')out.push(d.subarray(k+1));
      }
      j+=10+fs;
    }
    i=end;
  }
  return out;
}
function onCaption(data){
  n++;
  if(n<=3)say('字幕データ '+n+': '+Array.prototype.slice.call(data,0,8).map(function(x){return x.toString(16)}).join(' '));
  if(!r)return;
  try{
    var t=v.currentTime-delay;
    if(r.pushData)r.pushData(0x130,data,t);
    else say('pushData がありません');
  }catch(e){if(n<5)say('push error: '+e)}
}
function Parser(){
  this.buf=new Uint8Array(0);this.pmt={};this.id3=null;this.pes=null;
}
Parser.prototype.feed=function(c){
  var b=new Uint8Array(this.buf.length+c.length);b.set(this.buf);b.set(c,this.buf.length);
  var i=0;
  while(i+188<=b.length){
    if(b[i]!=0x47){i++;continue}
    this.pkt(b.subarray(i,i+188));i+=188;
  }
  this.buf=b.slice(i);
};
Parser.prototype.pkt=function(p){
  var pid=((p[1]&0x1f)<<8)|p[2],pusi=p[1]&0x40,afc=(p[3]>>4)&3;
  var off=4;if(afc&2)off+=1+p[4];
  if(!(afc&1)||off>=188)return;
  var pl=p.subarray(off);
  if(pid==0&&pusi){
    var s=pl.subarray(1+pl[0]);
    var end=3+(((s[1]&15)<<8)|s[2])-4;
    for(var i=8;i+4<=end;i+=4){
      if(((s[i]<<8)|s[i+1])!=0)this.pmt[((s[i+2]&0x1f)<<8)|s[i+3]]=1;
    }
  }else if(this.pmt[pid]&&pusi&&this.id3===null){
    var s=pl.subarray(1+pl[0]);
    var end=3+(((s[1]&15)<<8)|s[2])-4,pi=((s[10]&15)<<8)|s[11],i=12+pi;
    while(i+5<=end){
      var el=((s[i+3]&15)<<8)|s[i+4];
      if(s[i]==0x15){this.id3=((s[i+1]&0x1f)<<8)|s[i+2];say('ID3 PID: 0x'+this.id3.toString(16))}
      i+=5+el;
    }
  }else if(this.id3!==null&&pid==this.id3){
    if(pusi){this.flush();this.pes=[]}
    if(this.pes)this.pes.push(pl.slice());
  }
};
Parser.prototype.flush=function(){
  if(!this.pes)return;
  var len=0,i;for(i=0;i<this.pes.length;i++)len+=this.pes[i].length;
  var b=new Uint8Array(len),o=0;
  for(i=0;i<this.pes.length;i++){b.set(this.pes[i],o);o+=this.pes[i].length}
  this.pes=null;
  if(b.length<9||b[0]||b[1]||b[2]!=1)return;
  var d=b.subarray(9+b[8]);
  var a=privs(d);
  for(i=0;i<a.length;i++)onCaption(a[i]);
};
async function pull(url){
  var p=new Parser();
  try{
    var res=await fetch(url,{mode:'cors'});
    say('字幕元: '+res.status);
    var rd=res.body.getReader();
    for(;;){var x=await rd.read();if(x.done)break;p.feed(x.value)}
  }catch(e){say('字幕元エラー: '+e)}
}
document.getElementById('go').onclick=function(){
  logEl.textContent='';n=0;
  var L=window.aribb24js;
  if(!r&&L){
    try{r=new L.CanvasRenderer({forceStrokeColor:'black'});r.attachMedia(v);r.show();say('字幕レンダラー: OK');say('API: '+Object.keys(Object.getPrototypeOf(r)).join(','))}
    catch(e){say('レンダラーエラー: '+e)}
  }else if(!L)say('aribb24.js が読み込めません');
  v.src=document.getElementById('hls').value.trim();
  v.play().catch(function(e){say('再生: '+e)});
  pull(document.getElementById('ts').value.trim());
};
</script></body></html>
